<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171310" />
    <meta
      name="description"
      content="Explore seven interconnected undercity neighborhoods. Follow winding streets, discover shortcuts, and find a little life among the pipes."
    />
    <title>Gutterlight · The Lower Undercity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas
      id="world"
      aria-label="Gutterlight. Use WASD or arrow keys to move, E to interact, or click a destination."
      tabindex="0"
    ></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="hud">
      <div class="hud-left">
        <div class="character-status">
          <button
            id="journal"
            class="portrait"
            aria-label="Open Iona’s journal"
            title="Journal (J)"
          >
            <span id="district-count" aria-hidden="true">1</span>
          </button>
          <div class="character-meters">
            <meter id="energy" aria-label="Energy" min="0" max="1" value="1"></meter>
            <meter id="composure" aria-label="Composure" min="0" max="1" value="1"></meter>
          </div>
        </div>
        <button id="quest-track" aria-describedby="quest-step" aria-labelledby="quest-title">
          <span class="quest-icon" aria-hidden="true"></span>
          <span class="quest-copy">
            <strong id="quest-title"></strong>
            <span id="quest-step"></span>
          </span>
        </button>
        <button id="return-control" hidden>Take control</button>
      </div>
      <div class="hud-right">
        <button id="minimap-panel" aria-label="Open undercity map" title="Map (M)">
          <canvas id="minimap" width="320" height="320" aria-hidden="true"></canvas>
          <span class="compass" aria-hidden="true">N</span>
        </button>
        <button
          id="help"
          class="settings"
          aria-label="Settings and controls"
          title="Settings"
        ></button>
      </div>
    </header>
    <div id="speech" class="speech" hidden></div>
    <div id="interact-prompt" hidden>
      <button id="interact"><kbd>E</kbd><span id="interact-label">Inspect</span></button>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="loading">
      <span class="quest-icon" aria-hidden="true"></span>
      <h1>Lighting the lanes</h1>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button id="close-dialog" class="close" aria-label="Close dialog">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
